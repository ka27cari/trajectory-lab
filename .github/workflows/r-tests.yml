name: R tests and Shiny UI construction

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install UI and ordination dependencies
        run: Rscript install.R
      - name: Parse sources and run numerical regression tests
        run: Rscript tests/run_tests.R
      - name: Construct the Shiny app without launching a browser
        run: Rscript -e 'app <- source("app.R")$value; stopifnot(inherits(app, "shiny.appobj"))' 
