
name: R tests and Shiny UI construction

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
            any::ggplot2
            any::MASS

      - name: Verify package installation
        run: Rscript -e 'stopifnot(all(c("shiny", "bslib", "ggplot2", "MASS") %in% rownames(installed.packages())))'

      - name: Run numerical regression tests
        run: Rscript tests/run_tests.R

      - name: Construct Shiny app
        run: Rscript -e 'app <- source("app.R")$value; stopifnot(inherits(app, "shiny.appobj"))'
